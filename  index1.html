<title>Бичиг хөрвүүлэгч</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one working surface. Language bar with swap in the middle, input and output panels side by side, stacked on phones. */
:root{
  --bg:#EEF1F5; --panel:#FFFFFF; --ink:#14202E; --muted:#5A6878; --line:#D3DAE3;
  --accent:#1D4F91; --accent-ink:#FFFFFF; --warn:#B4640A; --soft:#E4EAF2;
  --ui:'Golos Text',system-ui,'Segoe UI',Arial,sans-serif;
  --mn:'Noto Sans Mongolian','Mongolian Baiti','Menksoft Qagan',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F151D; --panel:#17202B; --ink:#E6EBF2; --muted:#93A1B3; --line:#2A3646;
  --accent:#6FA3E8; --accent-ink:#0F151D; --warn:#E0A04A; --soft:#1F2A38; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151D; --panel:#17202B; --ink:#E6EBF2; --muted:#93A1B3; --line:#2A3646;
  --accent:#6FA3E8; --accent-ink:#0F151D; --warn:#E0A04A; --soft:#1F2A38; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:18px;line-height:1.5;
  padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:2rem;line-height:1.2;margin:0;font-weight:600;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:.95rem;max-width:60ch}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lang{flex:1 1 200px;min-width:0;padding:14px 18px;font-size:1.15rem;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-weight:500}
.lang small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.swap{flex:0 0 auto;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.3rem;cursor:pointer;display:grid;place-items:center}
.swap:hover{filter:brightness(1.1)}
button:focus-visible,textarea:focus-visible,.w:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panes{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:1200px){.panes{grid-template-columns:1fr 1fr}}
.pane{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column}
.phead{font-size:.95rem;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.82rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.phead button{font:inherit;text-transform:none;letter-spacing:0;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:3px 10px;cursor:pointer}
.phead button:hover{background:var(--soft)}
textarea,.out{width:100%;height:clamp(20rem,42vh,34rem);margin:0;border:0;background:transparent;color:var(--ink);padding:14px;font:inherit;font-size:1.5rem;line-height:1.6;resize:none;overflow:auto}
.out{white-space:pre-wrap;overflow-wrap:anywhere}
.mn{font-family:var(--mn);writing-mode:vertical-lr;font-size:2.3rem;line-height:1.9;white-space:pre-wrap}
.w{border-radius:3px;cursor:default}
.w.alts{cursor:pointer;background:var(--soft)}
.keys{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
.keys button{width:48px;height:54px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;font-family:var(--mn);font-size:1.7rem;cursor:pointer;padding:0}
.keys button:hover{background:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ex{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
.ex button{font:inherit;font-size:1.1rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 12px;border-radius:999px;cursor:pointer}
.ex button:hover{background:var(--soft)}
.note{font-size:.85rem;color:var(--muted);max-width:75ch;margin:0}
.tog{display:flex;gap:12px;flex-wrap:wrap}
.seg{display:flex;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.seg button{font:inherit;font-size:1rem;border:0;background:transparent;color:var(--muted);padding:8px 18px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.reading{padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:1.05rem;overflow-wrap:anywhere}
.reading b{color:var(--ink);font-weight:500}
.keys button.copied{background:var(--accent);color:var(--accent-ink)}
.altbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:10px 14px;border-top:1px solid var(--line)}
.altlab{width:100%;color:var(--muted);font-size:.85rem}
.alt{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:56px;padding:6px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit}
.alt.on{border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 1px var(--accent)}
.alt .g{font-size:1.15rem}
.alt .g.v{font-family:var(--mn);writing-mode:vertical-lr;font-size:1.5rem;line-height:1.35;max-height:8em;overflow:hidden}
.alt .c{font-size:.8rem;color:var(--muted)}
.alt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.posbtn{font:inherit;font-size:1rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 18px;border-radius:999px;cursor:pointer}
.posbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.poslegend{display:flex;flex-wrap:wrap;gap:6px 8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.poslegend .pc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:4px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:.9rem}
.poslegend .pc i{width:.8em;height:.8em;border-radius:50%;background:var(--c)}
.poslegend .pc[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.poslegend .note{width:100%;color:var(--muted);font-size:.8rem}
.out.pos-on .w{color:var(--pc,inherit)}
.out.pos-on .w.guessed{opacity:.72}
.out.pos-on.filtering .w{opacity:.2}
.out.pos-on.filtering .w.sel{opacity:1}
:root{--p-verb:#B3261E;--p-noun:#1D4F91;--p-name:#7B3FA0;--p-adj:#2E7D32;--p-pron:#00798A;--p-num:#A35F00;--p-adv:#AD1457;--p-func:#6D4C41}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--p-verb:#FF8A80;--p-noun:#7FB2F5;--p-name:#C79BE8;--p-adj:#7FD18A;--p-pron:#5CCFD8;--p-num:#F2B04D;--p-adv:#F48FB1;--p-func:#BCAAA4}}
:root[data-theme="dark"]{--p-verb:#FF8A80;--p-noun:#7FB2F5;--p-name:#C79BE8;--p-adj:#7FD18A;--p-pron:#5CCFD8;--p-num:#F2B04D;--p-adv:#F48FB1;--p-func:#BCAAA4}
</style>

<main>
  <div class="tog">
    <div class="seg" id="themeSeg"><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
    <div class="seg" id="langSeg"><button data-v="en">English</button><button data-v="mn">Монгол</button></div>
    <button class="posbtn" id="posBtn" type="button" aria-pressed="false">Word types</button>
  </div>

  <div class="bar">
    <div class="lang" id="from"></div>
    <button class="swap" id="swap" title="Swap direction" aria-label="Swap direction">⇄</button>
    <div class="lang" id="to"></div>
  </div>

  <div class="ex" id="examples"></div>

  <div class="panes">
    <section class="pane" id="inPane">
      <div class="phead"><span id="inLabel">Оруулах</span><button id="clear">Clear</button></div>
      <textarea id="input" spellcheck="false" autocomplete="off"></textarea>
      <div class="keys" id="keys"></div>
    </section>
    <section class="pane" id="outPane">
      <div class="phead"><span id="outLabel">Үр дүн</span><button id="copy">Copy</button></div>
      <div class="poslegend" id="poslegend" hidden></div>
      <div class="out" id="output" aria-live="polite"></div>
      <div class="reading" id="reading" hidden></div>
      <div class="altbar" id="altbar" hidden></div>
    </section>
  </div>
</main>

};
const LEX=new Map();
for(const k in LEXTXT)for(const w of LEXTXT[k].split(' '))if(!LEX.has(w))LEX.set(w,k);
const CASE_END=['нууд','нүүд','чууд','чүүд','гийн','гийг','гаас','гээс','гаар','гээр','ууд','үүд','аас','ээс','оос','өөс','аар','ээр','оор','өөр','тай','тэй','той','төй','руу','рүү','лүү','ийн','ыг','ийг','нар','нэр','ын','ны','ний','д','т','г','н'].sort((a,b)=>b.length-a.length);
function lexStem(w){
  for(const e of CASE_END){
    if(w.length>e.length+1&&w.endsWith(e)){const k=LEX.get(w.slice(0,-e.length));if(k&&k!=='func')return k}
  }
  return null;
}
const VSTEMS='бол бай ир яв ав өг хий хар сана мэд сур суралц ид уу унт бос ажилл тогл суу зогс оч хүр ол алд зур дуул сонс ойлг мэдр бод хэл хэлэ асуу хариул гар ор үз тав хөгж хөдөл бүтээ тусал хүс ун унш яр бич'.split(' ').sort((a,b)=>b.length-a.length);
const VENDS='х ж ч на нэ но нө сан сэн сон сөн лаа лээ лоо лөө даг дэг дог дөг в аад ээд оод өөд аарай ээрэй оорой өөрэй гаарай гээрэй гоорой гөөрэй аа ээ оо өө гаа гээ гоо гөө вал вэл вол вөл ваас вээс хаар хээр хоор хөөр'.split(' ').sort((a,b)=>b.length-a.length);
const VERB_RE=new RegExp('^(?:'+VSTEMS.join('|')+')[аэоуөүи]?(?:'+VENDS.join('|')+')$');
const STRONG_VERB=/(?:лаа|лээ|лоо|лөө|сан|сэн|сон|сөн|даг|дэг|дог|дөг|аад|ээд|оод|өөд|аарай|ээрэй|оорой|өөрэй|гаарай|гээрэй)$/;
// returns {t: type, sure: true when it comes from a list / dictionary, false when guessed from the ending}
function posOf(raw,capd,inDict){
  const w=raw.toLowerCase();
  if(FIX_POS[w])return{t:FIX_POS[w],sure:true};
  if(/[‐-]/.test(w))return{t:'name',sure:true};
  const a=LEX.get(w);if(a)return{t:a,sure:true};
  const b=lexStem(w);if(b)return{t:b,sure:true};
  if(capd&&inDict)return{t:'name',sure:true};
  if(VERB_RE.test(w))return{t:'verb',sure:true};
  if(inDict)return{t:'name',sure:false};
  if(w.length>=5&&STRONG_VERB.test(w))return{t:'verb',sure:false};
  if(w.length>=6&&/(?:дугаар|дүгээр|дахь|дэх)$/.test(w))return{t:'num',sure:false};
  return{t:'noun',sure:false};
}
const segOf=new WeakMap();
let posOn=false,posFilter=null;
function cyrOf(s){return dir==='c2t'?(s.src?s.src[s.i]:(s.orig||'')):show(s)}
function posFor(s){
  const w=cyrOf(s);
  const capd=dir==='c2t'?/^[A-ZА-ЯЁӨҮÖÜ]/.test(s.orig||''):s.kind==='dict';
  return posOf(w,capd,s.kind==='dict'||s.kind==='split');
}
function applyPos(sp,s){
  const z=posFor(s);
  sp.dataset.pos=z.t;
  sp.classList.toggle('guessed',!z.sure);
  if(posOn)sp.style.setProperty('--pc','var(--p-'+z.t+')');else sp.style.removeProperty('--pc');
  sp.classList.toggle('sel',!!posFilter&&z.t===posFilter);
  const base=sp.dataset.base||'';
  sp.title=base+(posOn?(base?' · ':'')+L[lg]['t_'+z.t]+(z.sure?'':' ?'):'');
}
const TYPES=['verb','noun','name','adj','pron','num','adv','func'];
function refreshPos(){
  output.classList.toggle('pos-on',posOn);
  output.classList.toggle('filtering',posOn&&!!posFilter);
  $('poslegend').hidden=!posOn;
  $('posBtn').setAttribute('aria-pressed',String(posOn));
  output.querySelectorAll('.w').forEach(el=>{const s=segOf.get(el);if(s)applyPos(el,s)});
}
function buildLegend(){
  const el=$('poslegend');el.textContent='';
  TYPES.forEach(k=>{
    const b=document.createElement('button');b.type='button';b.className='pc';
    b.style.setProperty('--c','var(--p-'+k+')');b.setAttribute('aria-pressed',String(posFilter===k));
    b.appendChild(document.createElement('i'));b.appendChild(document.createTextNode(L[lg]['t_'+k]));
    b.onclick=()=>{posFilter=posFilter===k?null:k;buildLegend();refreshPos()};
    el.appendChild(b)});
  const n=document.createElement('span');n.className='note';n.textContent=L[lg].posnote;el.appendChild(n);
}
const altbar=$('altbar');
function closeBar(){altbar.hidden=true;altbar.textContent=''}
function openBar(s,sp,rd){
  altbar.hidden=false;altbar.textContent='';
  const lab=document.createElement('span');lab.className='altlab';lab.textContent=L[lg].pick;altbar.appendChild(lab);
  s.alts.forEach((a,k)=>{
    const b=document.createElement('button');b.type='button';b.className='alt'+(k===s.i?' on':'');
    const g=document.createElement('span');g.className='g'+(dir==='c2t'?' v':'');g.textContent=s.cap?cap(a):a;b.appendChild(g);
    {const parts=[];if(s.src)parts.push(s.src[k]);if(s.labs&&s.labs[k])parts.push(L[lg]['lab_'+s.labs[k]]);if(parts.length){const c=document.createElement('span');c.className='c';c.textContent=parts.join(' · ');b.appendChild(c)}}
    b.onclick=()=>{s.i=k;sp.textContent=show(s);if(s.src)sp.dataset.base='→ '+s.src[k];applyPos(sp,s);rd();openBar(s,sp,rd)};
    altbar.appendChild(b)});
}
function render(){
  closeBar();
  const segs=convert(input.value,dir);
  output.textContent='';
  const rdEl=$('reading');
  const hasLat=dir==='c2t'&&segs.some(x=>x.src);
  const rd=()=>{if(!hasLat){rdEl.hidden=true;return}
    rdEl.hidden=false;rdEl.textContent='';
    const lab=document.createElement('b');lab.textContent=L[lg].read+' ';rdEl.appendChild(lab);
    rdEl.appendChild(document.createTextNode(segs.map(x=>x.text!==undefined?x.text:(x.src?x.src[x.i]:x.orig)).join('')))};
  for(const s of segs){
    if(s.text!==undefined){
      const map=dir==='c2t'?PUNCT_C2T:PUNCT_T2C;
      output.appendChild(document.createTextNode(s.text.replace(/[,.?!᠂᠃᠈᠉]/g,ch=>map[ch]||ch)));
      continue;
    }
    const sp=document.createElement('span');
    sp.className='w '+s.kind+(s.alts.length>1?' alts':'');
    sp.textContent=show(s);
    sp.title=(s.src?'→ '+s.src[s.i]+'  ·  ':'')+(s.kind==='dict'?(s.alts.length>1?s.alts.length+' spellings in the dictionary, click to switch':'Dictionary match')
      :s.kind==='split'?'Joined from two dictionary entries':'Not in the dictionary, estimated by rules');
    if(s.alts.length>1){sp.tabIndex=0;
      const open=()=>openBar(s,sp,rd);
      sp.onclick=open;sp.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};}
    sp.dataset.base=sp.title;segOf.set(sp,s);applyPos(sp,s);
    output.appendChild(sp);
  }
  rd();
}

mn:{trad:'Уламжлалт бичиг',cyr:'Кирилл',inp:'Оруулах',out:'Үр дүн',clear:'Цэвэрлэх',copy:'Хуулах',copied:'Хуулсан',sel:'Сонгосон',swap:'Чиглэл солих',try:'Жишээ: ',ph_t:'ᠪᠢᠴᠢᠩ ᠬᠠᠶᠢᠭᠠᠶ…',ph_c:'Кирилл эсвэл латинаар бичнэ үү…',read:'Уншилт:',pick:'Бичлэг сонгох:',posbtn:'Үгийн төрөл',lab_basic:'энгийн',lab_fv:'+ эцсийн а/э',lab_fi:'+ эцсийн и',lab_fu:'+ эцсийн у/ү',lab_long:'урт эгшиг давхар',lab_gal:'галиг үсэг',posnote:'Бүдэг = үгийн төгсгөлөөс таамагласан. Өнгө дарвал зөвхөн тэр төрлийг харуулна.',t_verb:'Үйл үг',t_noun:'Нэр үг',t_name:'Хүний нэр',t_adj:'Тэмдэг нэр',t_pron:'Төлөөний үг',t_num:'Тооны нэр',t_adv:'Дайвар үг',t_func:'Сул үг'}};
