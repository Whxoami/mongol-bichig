<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бичиг хөрвүүлэгч</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Noto+Sans+Mongolian&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(_){}</script>
<style>
/* Layout: one working surface. Language bar with swap in the middle, input panel with the output panel below it. */
:root{
  --bg:#EEF1F5; --panel:#FFFFFF; --ink:#14202E; --muted:#5A6878; --line:#D3DAE3;
  --accent:#1D4F91; --accent-ink:#FFFFFF; --warn:#B4640A; --soft:#E4EAF2;
  --ui:'Golos Text',system-ui,'Segoe UI',Arial,sans-serif;
  --mn:'Noto Sans Mongolian','Mongolian Baiti','Menksoft Qagan',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F151D; --panel:#17202B; --ink:#E6EBF2; --muted:#93A1B3; --line:#2A3646;
  --accent:#6FA3E8; --accent-ink:#0F151D; --warn:#E0A04A; --soft:#1F2A38; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151D; --panel:#17202B; --ink:#E6EBF2; --muted:#93A1B3; --line:#2A3646;
  --accent:#6FA3E8; --accent-ink:#0F151D; --warn:#E0A04A; --soft:#1F2A38; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:18px;line-height:1.5;
  padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 20px;flex-wrap:wrap}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.uilang{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:3px;flex:0 0 auto}
.uilang button{font:inherit;font-size:.85rem;font-weight:500;border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.uilang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
h1{font-size:2rem;line-height:1.2;margin:0;font-weight:600;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:.95rem;max-width:60ch}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lang{flex:1 1 200px;min-width:0;padding:14px 18px;font-size:1.15rem;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-weight:500}
.lang small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.swap{flex:0 0 auto;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.3rem;cursor:pointer;display:grid;place-items:center}
.swap:hover{filter:brightness(1.1)}
button:focus-visible,textarea:focus-visible,.w:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panes{display:grid;grid-template-columns:1fr;gap:16px}
.pane{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.82rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.phead button{font:inherit;text-transform:none;letter-spacing:0;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:3px 10px;cursor:pointer}
.phead button:hover{background:var(--soft)}
textarea,.out{width:100%;height:clamp(18rem,40vh,32rem);margin:0;border:0;background:transparent;color:var(--ink);padding:14px;font:inherit;font-size:1.5rem;line-height:1.6;resize:none;overflow:auto}
.out{white-space:pre-wrap;overflow-wrap:anywhere}
.mn{font-family:var(--mn);writing-mode:vertical-lr;font-size:2.3rem;line-height:1.9;white-space:pre-wrap}
.w{border-radius:3px;cursor:default}
.w.dict{}
.w.split{text-decoration:underline dotted var(--accent);text-underline-offset:5px}
.w.guess{text-decoration:underline wavy var(--warn);text-underline-offset:5px}
.w.alts{cursor:pointer;background:var(--soft)}
.keys{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
.keys button{width:48px;height:54px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;font-family:var(--mn);font-size:1.7rem;cursor:pointer;padding:0}
.keys button:hover{background:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ex{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
.ex button{font:inherit;font-size:1.1rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 12px;border-radius:999px;cursor:pointer}
.ex button:hover{background:var(--soft)}
.note{font-size:.85rem;color:var(--muted);max-width:75ch;margin:0}
.k{display:inline-block;width:3.2em;border-bottom:2px solid var(--muted);height:0;vertical-align:middle}
.k.s{border-bottom:2px dotted var(--accent)}.k.g{border-bottom:2px dotted var(--warn)}

/* ---- access and payment ---- */
:root{--ok:#1F7A4D;--ok-soft:#DDF0E5;--bad:#B3261E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ok:#5CC48C;--ok-soft:#173226;--bad:#F2877F}}
:root[data-theme="dark"]{--ok:#5CC48C;--ok-soft:#173226;--bad:#F2877F}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-variant-numeric:tabular-nums}
.chip::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ok)}
.chip.wait::before{background:var(--warn)}
.chip.full::before{background:var(--accent)}
.status .grow{flex:1 1 auto}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);padding:10px 18px;cursor:pointer}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.big{font-size:1.15rem;padding:14px 26px}
.under{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.count{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.count.over{color:var(--bad);font-weight:600}
.keys{border-top:1px solid var(--line)}
.msg{margin:0;padding:12px 16px;border-radius:8px;border:1px solid var(--line);background:var(--soft)}
.msg.err{border-color:var(--bad)}
.hint{color:var(--muted);padding:14px;margin:0}
.pay{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px}
.pay h2{margin:0;font-size:1.3rem}
.pay p{margin:0}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:620px){.plans{grid-template-columns:1fr}}
.plan{font:inherit;text-align:left;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.plan:hover{border-color:var(--accent)}
.plan[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.plan b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.plan small{color:var(--muted)}
.off{display:inline-block;align-self:flex-start;font-size:.8rem;font-weight:600;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:2px 10px}
.details{display:grid;grid-template-columns:max-content 1fr;gap:10px 18px;align-items:center;margin:0}
.details dt{color:var(--muted);font-size:.9rem}
.details dd{margin:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0;font-variant-numeric:tabular-nums;font-weight:500;overflow-wrap:anywhere}
.details .code{font-size:1.5rem;letter-spacing:.08em;font-weight:600}
.details button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:2px 10px;cursor:pointer}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.codebox{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.codebox input{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-transform:uppercase;width:12em;max-width:100%}

[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Монгол бичиг ⇄ Кирилл</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="tools">
      <div class="uilang" role="group" id="theme">
        <button type="button" data-theme="light" data-i18n="light"></button>
        <button type="button" data-theme="dark" data-i18n="dark"></button>
      </div>
      <div class="uilang" role="group" id="uilang">
        <button type="button" data-lang="en" lang="en">English</button>
        <button type="button" data-lang="mn" lang="mn">Монгол</button>
      </div>
    </div>
  </header>

  <div class="status" id="status" aria-live="polite">
    <span class="chip wait" id="chip">…</span>
    <span class="grow"></span>
    <button class="btn" id="getAccess" type="button" data-i18n="getAccess"></button>
  </div>

  <div class="bar">
    <div class="lang" id="from"></div>
    <button class="swap" id="swap" type="button">⇄</button>
    <div class="lang" id="to"></div>
  </div>

  <div class="ex" id="examples"></div>

  <div class="panes">
    <section class="pane">
      <div class="phead"><span data-i18n="inLabel"></span><button id="clear" type="button" data-i18n="clear"></button></div>
      <textarea id="input" spellcheck="false" autocomplete="off"></textarea>
      <div class="keys" id="keys" hidden></div>
      <div class="under">
        <span class="count" id="count"></span>
        <button class="btn big" id="go" type="button" data-i18n="convert"></button>
      </div>
    </section>
    <section class="pane">
      <div class="phead"><span data-i18n="outLabel"></span><button id="copy" type="button" data-i18n="copy"></button></div>
      <div class="out" id="output" aria-live="polite"></div>
    </section>
  </div>
  <p class="msg err" id="err" hidden></p>

  <section class="pay" id="pay" hidden>
    <h2 data-i18n="payTitle"></h2>
    <p id="payIntro"></p>
    <div class="plans" id="plans"></div>
    <div id="payBox" hidden>
      <ol class="steps">
        <li data-i18n="step2"></li>
        <li data-i18n="step3"></li>
      </ol>
      <dl class="details" id="details"></dl>
      <p class="msg" id="payWait" data-i18n="waiting"></p>
    </div>
    <p class="msg" id="payOff" hidden data-i18n="notOpen"></p>
    <div>
      <p data-i18n="haveCode"></p>
      <div class="codebox">
        <input id="codeIn" type="text" maxlength="12" autocomplete="off" spellcheck="false" placeholder="MB-XXXXXX">
        <button class="btn ghost" id="codeGo" type="button" data-i18n="apply"></button>
      </div>
      <p class="msg err" id="codeErr" hidden></p>
    </div>
  </section>

  <div class="legend">
    <span><i class="k"></i> <span data-i18n="lgDict"></span></span>
    <span><i class="k s"></i> <span data-i18n="lgSplit"></span></span>
    <span><i class="k g"></i> <span data-i18n="lgGuess"></span></span>
    <span data-i18n="lgAlts"></span>
  </div>
  <p class="note" data-i18n="note"></p>
</main>

<script>
(function(){
const $=id=>document.getElementById(id);
const lsGet=k=>{try{return localStorage.getItem(k)}catch(_){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(_){}};
const WORD=/[Ѐ-ӿ]+(?:[‐-][Ѐ-ӿ]+)*|[᠀-᢯‌‍]+(?:‐[᠀-᢯]+)*/g;
const countWords=t=>(t.match(WORD)||[]).length;
const money=n=>n.toLocaleString('en-US')+'₮';
const mmss=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

const UI={
  en:{title:'Script converter',
    sub:'Traditional Mongolian script and Cyrillic, both directions. Looks each word up in a dictionary of {n} names first.',
    uilang:'Site language',theme:'Colour mode',light:'Light',dark:'Dark',swap:'Swap direction',inLabel:'Input',outLabel:'Result',clear:'Clear',copy:'Copy',copied:'Copied',selected:'Selected',
    trad:'Traditional script',cyr:'Cyrillic',try:'Try: ',placeholder:'Type here…',insert:'Insert ',
    convert:'Convert',converting:'Converting…',hint:'The result appears here. Press Convert.',words:'{n} / {max} words',
    freeReady:'Free use ready · up to {n} words',freeWait:'Next free use in {t}',paidUntil:'Full access until {d} · up to {n} words, no waiting',
    getAccess:'Get full access',hideAccess:'Close',
    payTitle:'Get full access',payIntro:'Convert up to {n} words at a time with no waiting. Pay by bank transfer, then your access switches on once the payment is confirmed.',
    m1:'1 month',m3:'3 months',m12:'12 months',perMonth:'{p} a month',off:'{p}% off',
    step2:'Transfer the exact amount below and write your code in the transfer note.',step3:'Your access switches on once the payment is confirmed. This can take a little while, and you can close this page meanwhile.',
    bank:'Bank',accName:'Account name',accNo:'Account number',amount:'Amount',noteCode:'Transfer note (your code)',
    waiting:'Waiting for the payment to be confirmed… Your code is saved on this device.',
    notOpen:'Payments are not open yet. Please come back soon.',
    haveCode:'Already have an access code?',apply:'Use code',
    expired:'Your access ended on {d}. Pick a plan below to renew.',
    errTooLong:'Too long: {w} words, the limit is {n}.',errTooLongFree:' Shorten the text, or get full access for up to {m} words.',
    errCooldown:'You have used your free conversion. The next one is available in {t}, or get full access.',
    errDaily:'Daily limit reached for this code. Try again tomorrow.',errDevice:'This code is already in use on 2 devices.',errGeneric:'Something went wrong. Please try again.',errEmpty:'Type or paste some text first.',
    badCode:'This code is not valid.',pendingCode:'This code is waiting for payment confirmation.',expiredCode:'This code has expired.',
    lgDict:'exact dictionary match',lgSplit:'joined from two dictionary entries',lgGuess:'estimated by spelling rules, please check',
    lgAlts:'shaded word: more than one spelling, click to switch',
    note:'The dictionary covers personal names. Other words fall back to spelling rules, which get the letters mostly right but cannot know the historical spelling of traditional script, so those words need a check.',
    tAlts:'{n} spellings in the dictionary, click to switch',tDict:'Dictionary match',tSplit:'Joined from two dictionary entries',tGuess:'Not in the dictionary, estimated by rules'},
  mn:{title:'Бичиг хөрвүүлэгч',
    sub:'Монгол бичиг болон кирилл үсгийг хоёр чиглэлд хөрвүүлнэ. Үг бүрийг эхлээд {n} нэр бүхий толь бичгээс хайна.',
    uilang:'Сайтын хэл',theme:'Өнгөний горим',light:'Цайвар',dark:'Бараан',swap:'Чиглэл солих',inLabel:'Оруулах',outLabel:'Үр дүн',clear:'Арилгах',copy:'Хуулах',copied:'Хуулсан',selected:'Сонгосон',
    trad:'Уламжлалт бичиг',cyr:'Кирилл үсэг',try:'Жишээ: ',placeholder:'Энд бичнэ үү…',insert:'Оруулах ',
    convert:'Хөрвүүлэх',converting:'Хөрвүүлж байна…',hint:'Үр дүн энд гарна. «Хөрвүүлэх» товчийг дарна уу.',words:'{n} / {max} үг',
    freeReady:'Үнэгүй хөрвүүлэлт бэлэн · {n} үг хүртэл',freeWait:'Дараагийн үнэгүй хөрвүүлэлт: {t}',paidUntil:'Бүрэн эрх {d} хүртэл · {n} үг хүртэл, хүлээлтгүй',
    getAccess:'Бүрэн эрх авах',hideAccess:'Хаах',
    payTitle:'Бүрэн эрх авах',payIntro:'Хүлээлтгүйгээр нэг дор {n} үг хүртэл хөрвүүлнэ. Банкны шилжүүлгээр төлнө, төлбөр батлагдмагц эрх нээгдэнэ.',
    m1:'1 сар',m3:'3 сар',m12:'12 сар',perMonth:'сард {p}',off:'{p}% хөнгөлөлт',
    step2:'Доорх дүнг яг тэр чигээр шилжүүлж, гүйлгээний утга дээр кодоо бичнэ үү.',step3:'Төлбөр батлагдмагц эрх нээгдэнэ. Хэсэг хугацаа шаардаж болох тул энэ хуудсыг хааж болно.',
    bank:'Банк',accName:'Дансны нэр',accNo:'Дансны дугаар',amount:'Дүн',noteCode:'Гүйлгээний утга (таны код)',
    waiting:'Төлбөр батлагдахыг хүлээж байна… Таны код энэ төхөөрөмж дээр хадгалагдсан.',
    notOpen:'Төлбөр хүлээн авах хэсэг одоохондоо нээгдээгүй байна. Удахгүй нээгдэнэ.',
    haveCode:'Хандах кодтой юу?',apply:'Код ашиглах',
    expired:'Таны эрх {d}-д дууссан. Доороос багц сонгож шинэчилнэ үү.',
    errTooLong:'Хэт урт байна: {w} үг, хязгаар {n} үг.',errTooLongFree:' Текстээ богиносгох эсвэл {m} үг хүртэл хөрвүүлэх бүрэн эрх аваарай.',
    errCooldown:'Та үнэгүй хөрвүүлэлтээ ашигласан. Дараагийнх {t}-ын дараа нээгдэнэ, эсвэл бүрэн эрх аваарай.',
    errDaily:'Энэ кодын өнөөдрийн хязгаар хэтэрлээ. Маргааш дахин оролдоно уу.',errDevice:'Энэ код 2 төхөөрөмж дээр ашиглагдаж байна.',errGeneric:'Алдаа гарлаа. Дахин оролдоно уу.',errEmpty:'Эхлээд текст бичих эсвэл буулгана уу.',
    badCode:'Энэ код буруу байна.',pendingCode:'Энэ код төлбөр батлагдахыг хүлээж байна.',expiredCode:'Энэ кодын хугацаа дууссан.',
    lgDict:'толь бичигт яг таарсан',lgSplit:'толь бичгийн хоёр үгийг нийлүүлсэн',lgGuess:'дүрмээр тооцоолсон, шалгана уу',
    lgAlts:'сүүдэртэй үг: хэд хэдэн бичлэгтэй, дарж солино',
    note:'Толь бичигт хүний нэрс багтсан. Бусад үгийг бичгийн дүрмээр хөрвүүлдэг. Үсгийг ихэнхдээ зөв гаргадаг ч монгол бичгийн уламжлалт бичлэгийг мэдэх боломжгүй тул эдгээр үгийг шалгах хэрэгтэй.',
    tAlts:'Толь бичигт {n} бичлэг байна, дарж солино',tDict:'Толь бичигт таарсан',tSplit:'Толь бичгийн хоёр үгээс нийлүүлсэн',tGuess:'Толь бичигт байхгүй, дүрмээр тооцоолсон'}
};
let ui=(()=>{const v=lsGet('uiLang');if(UI[v])return v;return (navigator.language||'').startsWith('mn')?'mn':'en'})();
const L=(k,v)=>{let s=UI[ui][k]||k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};

const input=$('input'),output=$('output');
let dir='t2c',S=null,freeUntil=0,busy=false,openPlan=null,pollT=null;
const fmtDate=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

/* ---------- server calls ---------- */
const code=()=>lsGet('mbCode')||lsGet('mbRef')||'';
async function api(path,body){
  const r=await fetch(path,{method:body?'POST':'GET',credentials:'same-origin',headers:{'content-type':'application/json','x-access-code':code()},body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch(_){}
  return{status:r.status,body:j};
}
async function loadStatus(){
  try{const r=await api('/api/status');if(r.status===200){S=r.body;
    freeUntil=S.free.retryAfter>0?Date.now()+S.free.retryAfter*1000:0;
    if(S.access.state==='active'&&lsGet('mbRef')&&lsGet('mbRef')===code()){lsSet('mbCode',code());lsSet('mbRef',null)}
    if(S.access.state==='pending')ensurePoll();
    if(['invalid','revoked'].includes(S.access.state)){lsSet('mbCode',null)}
  }}catch(_){}
  render();
}
function ensurePoll(){if(pollT)return;pollT=setInterval(async()=>{
  if(!lsGet('mbRef')){clearInterval(pollT);pollT=null;return}
  await loadStatus();
  if(S&&S.access.state==='active'){clearInterval(pollT);pollT=null;$('pay').hidden=true}
},8000)}
const paid=()=>S&&S.access.state==='active';
const maxWords=()=>S?(paid()?S.limits.paid:S.limits.free):200;

/* ---------- status bar ---------- */
function renderStatus(){
  const chip=$('chip');if(!S){chip.textContent='…';return}
  const a=S.access;
  if(a.state==='active'){chip.className='chip full';chip.textContent=L('paidUntil',{d:fmtDate(a.expiresAt),n:S.limits.paid});$('getAccess').textContent=L('getAccess');}
  else{
    const left=(freeUntil-Date.now())/1000;
    if(left>0){chip.className='chip wait';chip.textContent=L('freeWait',{t:mmss(left)})}
    else{chip.className='chip';chip.textContent=L('freeReady',{n:S.limits.free})}
  }
  $('getAccess').textContent=$('pay').hidden?L('getAccess'):L('hideAccess');
  $('getAccess').hidden=paid()&&$('pay').hidden;
}
function renderCount(){
  const n=countWords(input.value),m=maxWords();
  $('count').textContent=L('words',{n,max:m});$('count').classList.toggle('over',n>m);
  $('go').disabled=busy||n===0||n>m;
}
function render(){renderStatus();renderCount()}
setInterval(()=>{if(S&&!paid()&&freeUntil)renderStatus()},1000);

/* ---------- conversion ---------- */
function showErr(m){const e=$('err');e.textContent=m;e.hidden=!m}
function renderSegs(segs){
  output.textContent='';
  for(const s of segs){
    if(s.text!==undefined){output.appendChild(document.createTextNode(s.text));continue}
    const sp=document.createElement('span');let i=0;
    sp.className='w '+s.kind+(s.alts.length>1?' alts':'');
    sp.textContent=s.alts[0];
    sp.title=s.kind==='dict'?(s.alts.length>1?L('tAlts',{n:s.alts.length}):L('tDict')):s.kind==='split'?L('tSplit'):L('tGuess');
    if(s.alts.length>1){sp.tabIndex=0;
      const next=()=>{i=(i+1)%s.alts.length;sp.textContent=s.alts[i]};
      sp.onclick=next;sp.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();next()}}}
    output.appendChild(sp);
  }
}
async function go(){
  if(busy)return;
  const text=input.value;if(!text.trim()){showErr(L('errEmpty'));return}
  showErr('');busy=true;$('go').textContent=L('converting');renderCount();
  try{
    const r=await api('/api/convert',{text,dir});const b=r.body;
    if(r.status===200){renderSegs(b.segments);
      if(b.free){freeUntil=Date.now()+b.free.retryAfter*1000}
      if(S)S.access=b.access||S.access;
    }else if(r.status===413){
      showErr(L('errTooLong',{w:b.words,n:b.limit})+(b.free?L('errTooLongFree',{m:S?S.limits.paid:3000}):''));
    }else if(r.status===429&&b.error==='cooldown'){
      freeUntil=Date.now()+b.retryAfter*1000;showErr(L('errCooldown',{t:mmss(b.retryAfter)}));
    }else if(r.status===429&&b.error==='daily_cap')showErr(L('errDaily'));
    else if(b.access&&b.access.state==='device_limit')showErr(L('errDevice'));
    else showErr(L('errGeneric'));
    if(b.access&&b.access.state==='device_limit')showErr(L('errDevice'));
  }catch(_){showErr(L('errGeneric'))}
  busy=false;$('go').textContent=L('convert');render();
}
$('go').onclick=go;
input.addEventListener('input',()=>{renderCount()});
input.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();go()}});

/* ---------- payment panel ---------- */
function planName(p){return L('m'+p.id.replace('m',''))}
function renderPlans(){
  const box=$('plans');box.textContent='';if(!S)return;
  const base=S.plans.find(p=>p.id==='1m');
  S.plans.forEach(p=>{
    const months=p.days>=360?12:Math.round(p.days/30),pm=Math.round(p.price/months);
    const off=Math.round((1-pm/base.price)*100);
    const b=document.createElement('button');b.type='button';b.className='plan';b.setAttribute('aria-pressed',openPlan===p.id);
    b.innerHTML='<small>'+planName(p)+'</small><b>'+money(p.price)+'</b><small>'+L('perMonth',{p:money(pm)})+'</small>'+(off>0?'<span class="off">'+L('off',{p:off})+'</span>':'');
    b.onclick=()=>choose(p.id);box.appendChild(b);
  });
}
function detailRow(dl,label,val,copyable,cls){
  const dt=document.createElement('dt');dt.textContent=label;const dd=document.createElement('dd');
  const s=document.createElement('span');s.textContent=val;if(cls)s.className=cls;dd.appendChild(s);
  if(copyable){const b=document.createElement('button');b.type='button';b.textContent=L('copy');
    b.onclick=async()=>{try{await navigator.clipboard.writeText(String(copyable));b.textContent=L('copied')}catch(_){const r=document.createRange();r.selectNodeContents(s);const g=getSelection();g.removeAllRanges();g.addRange(r);b.textContent=L('selected')}setTimeout(()=>b.textContent=L('copy'),1400)};dd.appendChild(b)}
  dl.append(dt,dd);
}
async function choose(planId){
  openPlan=planId;renderPlans();
  if(!S||!S.pay){$('payBox').hidden=true;$('payOff').hidden=false;return}
  const renewOf=(S.access.state==='active'||S.access.state==='expired')?lsGet('mbCode'):null;
  const r=await api('/api/request',{plan:planId,renewOf});
  if(r.status!==200){showErr(L('errGeneric'));return}
  lsSet('mbRef',r.body.code);
  const dl=$('details');dl.textContent='';
  detailRow(dl,L('bank'),S.pay.bank);detailRow(dl,L('accName'),S.pay.name);
  detailRow(dl,L('accNo'),S.pay.account,S.pay.account);
  detailRow(dl,L('amount'),money(r.body.amount),r.body.amount);
  detailRow(dl,L('noteCode'),r.body.code,r.body.code,'code');
  $('payBox').hidden=false;$('payOff').hidden=true;ensurePoll();
}
function togglePay(force){
  const p=$('pay');p.hidden=force!==undefined?!force:!p.hidden;
  if(!p.hidden){
    $('payIntro').textContent=L('payIntro',{n:S?S.limits.paid:3000});
    if(S&&S.access.state==='expired')$('payIntro').textContent=L('expired',{d:fmtDate(S.access.expiresAt)})+' '+$('payIntro').textContent;
    renderPlans();$('payOff').hidden=!(S&&!S.pay);
    p.scrollIntoView({behavior:'smooth',block:'start'});
  }
  renderStatus();
}
$('getAccess').onclick=()=>togglePay();
$('codeGo').onclick=async()=>{
  const v=$('codeIn').value.trim().toUpperCase(),e=$('codeErr');e.hidden=true;if(!v)return;
  const prev=lsGet('mbCode');lsSet('mbCode',v);await loadStatus();
  const st=S&&S.access.state;
  if(st==='active'){togglePay(false);$('codeIn').value=''}
  else{lsSet('mbCode',prev);e.textContent=st==='pending'?L('pendingCode'):st==='expired'?L('expiredCode'):st==='device_limit'?L('errDevice'):L('badCode');e.hidden=false;await loadStatus()}
};

/* ---------- direction, examples, keys, theme, language ---------- */
const TRAD=()=>'<b>Монгол бичиг</b><small>'+L('trad')+'</small>',CYR=()=>'<b>Кирилл</b><small>'+L('cyr')+'</small>';
const EX_T=['ᠲᠦᠮᠡᠨᠵᠣᠷᠢᠭ','ᠡᠷᠳᠡᠨᠢᠴᠣᠭᠰᠤᠮ','ᠪᠤᠶᠠᠨᠬᠦᠦ','ᠡᠩᠬᠡᠲᠩᠷᠢ'],EX_C=['Түмэнзориг','Эрдэнэчогсом','Буянхүү','Энхтэнгэр','Сүхцэцэг'];
function setDir(d,keep){
  dir=d;const t=d==='t2c';
  $('from').innerHTML=t?TRAD():CYR();$('to').innerHTML=t?CYR():TRAD();
  input.classList.toggle('mn',t);output.classList.toggle('mn',!t);
  $('keys').hidden=!t;
  input.placeholder=t?'ᠪᠢᠴᠢᠩ ᠬᠠᠶᠢᠭᠠᠶ…':L('placeholder');
  const ex=$('examples');ex.textContent=L('try');
  (t?EX_T:EX_C).forEach(w=>{const b=document.createElement('button');b.type='button';b.textContent=w;if(t)b.style.fontFamily='var(--mn)';
    b.onclick=()=>{input.value=(input.value.trim()?input.value.trimEnd()+' ':'')+w;renderCount()};ex.appendChild(b)});
  if(!keep){showHint()}
}
function showHint(){output.textContent='';const p=document.createElement('p');p.className='hint';p.textContent=L('hint');p.style.writingMode='horizontal-tb';p.style.fontFamily='var(--ui)';p.style.fontSize='1rem';output.appendChild(p)}
$('swap').onclick=()=>{const prev=[...output.children].some(c=>c.classList.contains('hint'))?'':output.textContent;setDir(dir==='t2c'?'c2t':'t2c',true);input.value=prev;showHint();showErr('');renderCount()};
$('clear').onclick=()=>{input.value='';showHint();showErr('');renderCount();input.focus()};
$('copy').onclick=async e=>{
  const b=e.currentTarget,txt=[...output.children].some(c=>c.classList.contains('hint'))?'':output.textContent;
  try{await navigator.clipboard.writeText(txt);b.textContent=L('copied')}
  catch(_){const r=document.createRange();r.selectNodeContents(output);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent=L('selected')}
  setTimeout(()=>b.textContent=L('copy'),1400)};
const keys=$('keys');
[...'ᠠᠡᠢᠣᠤᠥᠦᠨᠩᠪᠫᠬᠭᠮᠯᠰᠱᠲᠳᠴᠵᠶᠷᠸᠹᠺᠻ'].forEach(ch=>{
  const b=document.createElement('button');b.type='button';b.textContent=ch;b.dataset.ch=ch;
  b.onmousedown=e=>e.preventDefault();
  b.onclick=()=>{const s=input.selectionStart??input.value.length,e=input.selectionEnd??s;
    input.setRangeText(ch,s,e,'end');input.focus();renderCount()};
  keys.appendChild(b)});
function setUi(l){
  ui=l;lsSet('uiLang',l);
  document.documentElement.lang=l;document.title=L('title');
  $('sub').textContent=L('sub',{n:S?S.names.toLocaleString('en-US'):'28,595'});
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=L(el.dataset.i18n));
  $('swap').title=L('swap');$('swap').setAttribute('aria-label',L('swap'));
  $('uilang').setAttribute('aria-label',L('uilang'));$('theme').setAttribute('aria-label',L('theme'));
  $('uilang').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===l));
  keys.querySelectorAll('button').forEach(b=>b.setAttribute('aria-label',L('insert')+b.dataset.ch));
  $('go').textContent=busy?L('converting'):L('convert');
  const hadHint=[...output.children].some(c=>c.classList.contains('hint'));
  setDir(dir,true);if(hadHint||!output.children.length)showHint();
  if(!$('pay').hidden){$('payIntro').textContent=L('payIntro',{n:S?S.limits.paid:3000});renderPlans()}
  render();
}
$('uilang').querySelectorAll('button').forEach(b=>b.onclick=()=>setUi(b.dataset.lang));
const darkMq=matchMedia('(prefers-color-scheme:dark)');
function curTheme(){return document.documentElement.dataset.theme||(darkMq.matches?'dark':'light')}
function showTheme(){const t=curTheme();$('theme').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===t))}
$('theme').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  document.documentElement.dataset.theme=b.dataset.theme;lsSet('theme',b.dataset.theme);showTheme()});
darkMq.addEventListener?.('change',showTheme);
showTheme();
input.value='ᠲᠦᠮᠡᠨᠵᠣᠷᠢᠭ ᠡᠩᠬᠡᠲᠩᠷᠢ';
setUi(ui);
loadStatus().then(()=>setUi(ui));
})();

</script>
</body>
