<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Approvals</title>
<style>
:root{--bg:#EEF1F5;--panel:#FFFFFF;--ink:#14202E;--muted:#5A6878;--line:#D3DAE3;--accent:#1D4F91;--accent-ink:#FFFFFF;--soft:#E4EAF2;--ok:#1F7A4D;--bad:#B3261E;--ui:'Golos Text',system-ui,'Segoe UI',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0F151D;--panel:#17202B;--ink:#E6EBF2;--muted:#93A1B3;--line:#2A3646;--accent:#6FA3E8;--accent-ink:#0F151D;--soft:#1F2A38;--ok:#5CC48C;--bad:#F2877F;color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.5;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:1.6rem}h2{margin:0 0 10px;font-size:1.1rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;max-width:100%}
button{font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);padding:10px 16px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
button.bad{background:transparent;color:var(--bad);border:1px solid var(--bad);font-weight:500}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.item{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.item:first-of-type{border-top:0}
.code{font-size:1.3rem;font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.meta{color:var(--muted);font-size:.92rem}
.msg{margin:0;padding:10px 14px;border-radius:8px;background:var(--soft);border:1px solid var(--line)}
.msg.err{border-color:var(--bad)}
.empty{color:var(--muted);margin:0}
</style>
</head>
<body>
<main>
  <h1>Approvals</h1>
  <section class="card" id="login">
    <h2>Owner password</h2>
    <form class="row" id="loginForm">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
      <button type="submit">Open</button>
    </form>
    <p class="msg err" id="loginErr" hidden></p>
  </section>

  <div id="app" hidden style="display:flex;flex-direction:column;gap:18px">
    <section class="card">
      <h2>Waiting for payment check</h2>
      <p class="meta">Open your Golomt app. Find the payment, check the amount and that the transfer note contains the code, then tap the matching button.</p>
      <div id="pending"></div>
    </section>
    <section class="card">
      <h2>Make a code yourself</h2>
      <form class="row" id="createForm">
        <select id="cPlan" aria-label="Plan"></select>
        <input id="cNote" placeholder="Note (optional, e.g. name)" maxlength="80" aria-label="Note">
        <button type="submit">Create code</button>
      </form>
      <p class="msg" id="created" hidden></p>
    </section>
    <section class="card">
      <h2>Active access</h2>
      <div id="active"></div>
    </section>
    <section class="card">
      <h2>Recently revoked</h2>
      <div id="revoked"></div>
    </section>
    <p class="msg err" id="appErr" hidden></p>
  </div>
</main>
<script>
(function(){
const $=id=>document.getElementById(id);
const money=n=>n.toLocaleString('en-US')+'₮';
const PN={'1m':'1 month','3m':'3 months','12m':'12 months'};
const fmt=ms=>new Date(ms).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
let pw=null;try{pw=sessionStorage.getItem('adminPw')}catch(_){}
async function call(body){
  const r=await fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json','x-admin-password':pw||''},body:JSON.stringify(body)});
  let j={};try{j=await r.json()}catch(_){}return{status:r.status,body:j};
}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function show(d){
  $('login').hidden=true;$('app').hidden=false;$('app').style.display='flex';
  const sel=$('cPlan');if(!sel.children.length)d.plans.forEach(p=>{const o=el('option',null,PN[p.id]+' – '+money(p.price));o.value=p.id;sel.appendChild(o)});
  const P=$('pending');P.textContent='';
  if(!d.pending.length)P.appendChild(el('p','empty','Nothing waiting.'));
  d.pending.forEach(r=>{
    const it=el('div','item');it.appendChild(el('div','code',r.code));
    it.appendChild(el('div','meta','Asked for '+PN[r.plan]+' ('+money(r.amount)+') · '+fmt(r.createdAt)+(r.renewOf?' · renewal':'')));
    const row=el('div','row');
    d.plans.forEach(p=>{const b=el('button',p.id===r.plan?'':'ghost','Approve '+PN[p.id]+' · '+money(p.price));
      b.onclick=()=>act({action:'approve',code:r.code,plan:p.id});row.appendChild(b)});
    const x=el('button','bad','Reject');x.onclick=()=>act({action:'delete',code:r.code});row.appendChild(x);
    it.appendChild(row);P.appendChild(it)});
  const A=$('active');A.textContent='';
  if(!d.active.length)A.appendChild(el('p','empty','No active access yet.'));
  d.active.forEach(r=>{
    const it=el('div','item');const top=el('div','row');top.appendChild(el('span','code',r.code));
    const left=Math.ceil((r.expiresAt-d.now)/86400000);
    top.appendChild(el('span','meta',PN[r.plan]+' · '+(left>0?left+' days left':'expired')+' · until '+fmt(r.expiresAt)+' · '+r.devices+'/2 devices'+(r.note?' · '+r.note:'')));
    it.appendChild(top);const row=el('div','row');
    const b=el('button','bad','Revoke');b.onclick=()=>act({action:'revoke',code:r.code});row.appendChild(b);it.appendChild(row);A.appendChild(it)});
  const R=$('revoked');R.textContent='';
  if(!d.revoked.length)R.appendChild(el('p','empty','None.'));
  d.revoked.forEach(r=>{const it=el('div','item');it.appendChild(el('span','meta',r.code+' · '+PN[r.plan]));R.appendChild(it)});
}
function appErr(m){const e=$('appErr');e.textContent=m||'';e.hidden=!m}
async function act(body){
  appErr('');const r=await call(body);
  if(r.status===200){show(r.body);if(r.body.created){const m=$('created');m.textContent='New code: '+r.body.created+'. Send it to the customer.';m.hidden=false}}
  else appErr(r.status===401?'Wrong password.':r.status===404?'That request is no longer there.':'Something went wrong ('+r.status+').');
}
async function open(){
  const r=await call({action:'list'});
  if(r.status===200){try{sessionStorage.setItem('adminPw',pw)}catch(_){}show(r.body);return}
  pw=null;try{sessionStorage.removeItem('adminPw')}catch(_){}
  $('login').hidden=false;$('app').hidden=true;
  const e=$('loginErr');e.hidden=false;
  e.textContent=r.status===401?'Wrong password.':r.status===429?'Too many tries. Wait 15 minutes.':r.status===503?'Admin is not set up yet: add the ADMIN_PASSWORD setting in Netlify.':'Something went wrong ('+r.status+').';
}
$('loginForm').onsubmit=e=>{e.preventDefault();pw=$('pw').value;$('loginErr').hidden=true;open()};
$('createForm').onsubmit=e=>{e.preventDefault();act({action:'create',plan:$('cPlan').value,note:$('cNote').value});$('cNote').value=''};
if(pw)open();
setInterval(()=>{if(pw&&!$('app').hidden)call({action:'list'}).then(r=>{if(r.status===200)show(r.body)})},30000);
})();
</script>
</body>
</html>
