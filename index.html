<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Бичиг хөрвүүлэгч</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Noto+Sans+Mongolian&display=swap" rel="stylesheet">
  <script>
    try {
      const theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.dataset.theme = theme;
      }
    } catch (_) {}
  </script>
  <style>
    :root {
      --bg: #EEF1F5;
      --panel: #FFFFFF;
      --ink: #14202E;
      --muted: #5A6878;
      --line: #D3DAE3;
      --accent: #1D4F91;
      --accent-ink: #FFFFFF;
      --warn: #B4640A;
      --soft: #E4EAF2;
      --ui: "Golos Text", system-ui, "Segoe UI", Arial, sans-serif;
      --mn: "Noto Sans Mongolian", "Mongolian Baiti", "Menksoft Qagan", serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0F151D;
        --panel: #17202B;
        --ink: #E6EBF2;
        --muted: #93A1B3;
        --line: #2A3646;
        --accent: #6FA3E8;
        --accent-ink: #0F151D;
        --warn: #E0A04A;
        --soft: #1F2A38;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0F151D;
      --panel: #17202B;
      --ink: #E6EBF2;
      --muted: #93A1B3;
      --line: #2A3646;
      --accent: #6FA3E8;
      --accent-ink: #0F151D;
      --warn: #E0A04A;
      --soft: #1F2A38;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--ui);
      font-size: 16px;
      line-height: 1.5;
      padding-block: 28px 40px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    main {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px 20px;
      flex-wrap: wrap;
    }

    .tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .uilang {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      padding: 3px;
      flex: 0 0 auto;
    }

    .uilang button {
      font: inherit;
      font-size: .85rem;
      font-weight: 500;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
    }

    .uilang button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-ink);
    }

    h1 {
      font-size: 1.6rem;
      line-height: 1.2;
      margin: 0;
      font-weight: 600;
      text-wrap: balance;
    }

    .sub {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .95rem;
      max-width: 60ch;
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .lang {
      flex: 1 1 200px;
      min-width: 0;
      padding: 10px 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      font-weight: 500;
    }

    .lang small {
      display: block;
      color: var(--muted);
      font-weight: 400;
      font-size: .78rem;
    }

    .swap {
      flex: 0 0 auto;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 0;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 1.3rem;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .swap:hover { filter: brightness(1.1); }

    button:focus-visible,
    textarea:focus-visible,
    .w:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .panes {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .pane {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
    }

    .phead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      font-size: .82rem;
      color: var(--muted);
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .phead button {
      font: inherit;
      text-transform: none;
      letter-spacing: 0;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 6px;
      padding: 3px 10px;
      cursor: pointer;
    }

    .phead button:hover { background: var(--soft); }

    textarea,
    .out {
      width: 100%;
      height: 14rem;
      margin: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      padding: 14px;
      font: inherit;
      font-size: 1.2rem;
      line-height: 1.6;
      resize: none;
      overflow: auto;
    }

    .out {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .mn {
      font-family: var(--mn);
      writing-mode: vertical-lr;
      font-size: 1.7rem;
      line-height: 1.9;
      white-space: pre-wrap;
    }

    .w { border-radius: 3px; cursor: default; }
    .w.dict {}
    .w.split { text-decoration: underline dotted var(--accent); text-underline-offset: 5px; }
    .w.guess { text-decoration: underline wavy var(--warn); text-underline-offset: 5px; }
    .w.alts { cursor: pointer; background: var(--soft); }

    .keys {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 14px;
      border-top: 1px solid var(--line);
    }

    .keys button {
      width: 40px;
      height: 44px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      border-radius: 6px;
      font-family: var(--mn);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0;
    }

    .keys button:hover { background: var(--soft); }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 22px;
      font-size: .85rem;
      color: var(--muted);
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .ex {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: .9rem;
      color: var(--muted);
    }

    .ex button {
      font: inherit;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      padding: 4px 12px;
      border-radius: 999px;
      cursor: pointer;
    }

    .ex button:hover { background: var(--soft); }

    .note {
      font-size: .85rem;
      color: var(--muted);
      max-width: 75ch;
      margin: 0;
    }

    .k {
      display: inline-block;
      width: 3.2em;
      border-bottom: 2px solid var(--muted);
      height: 0;
      vertical-align: middle;
    }

    .k.s { border-bottom: 2px dotted var(--accent); }
    .k.g { border-bottom: 2px dotted var(--warn); }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Монгол бичиг ⇄ Кирилл</h1>
      </div>
      <div class="tools">
        <div class="uilang" role="group" id="theme">
          <button type="button" data-theme="light">Light</button>
          <button type="button" data-theme="dark">Dark</button>
        </div>
        <div class="uilang" role="group" id="uilang">
          <button type="button" data-lang="en" lang="en">English</button>
          <button type="button" data-lang="mn" lang="mn">Монгол</button>
        </div>
      </div>
    </header>

    <div class="bar">
      <div class="lang" id="from">Кирилл</div>
      <button class="swap" id="swap" aria-label="Swap languages">⇄</button>
      <div class="lang" id="to">Монгол бичиг</div>
    </div>

    <div class="panes">
      <section class="pane">
        <div class="phead"><span>Input</span><button id="clear" type="button">Clear</button></div>
        <textarea id="input" spellcheck="false" autocomplete="off" aria-label="Input text"></textarea>
      </section>
      <section class="pane">
        <div class="phead"><span>Output</span><button id="copy" type="button">Copy</button></div>
        <div class="out" id="output" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <script>
    const cyrToMong = {
      'а': 'ᠠ', 'б': 'ᠪ', 'в': 'ᠸ', 'г': 'ᠭ', 'д': 'ᠳ', 'е': 'ᠡ', 'ё': 'ᠶᠣ', 'ж': 'ᠵ', 'з': 'ᠽ', 'и': 'ᠢ', 'й': 'ᠶ', 'к': 'ᠬ', 'л': 'ᠯ', 'м': 'ᠮ', 'н': 'ᠨ', 'о': 'ᠣ', 'ө': 'ᠥ', 'п': 'ᠫ', 'р': 'ᠷ', 'с': 'ᠰ', 'т': 'ᠲ', 'у': 'ᠤ', 'ү': 'ᠦ', 'ф': 'ᠹ', 'х': 'ᠬ', 'ц': 'ᠴ', 'ч': 'ᠴ', 'ш': 'ᠱ', 'э': 'ᠡ', 'ю': 'ᠶᠤ', 'я': 'ᠶᠠ', 'ъ': '', 'ь': '',
      'А': 'ᠠ', 'Б': 'ᠪ', 'В': 'ᠸ', 'Г': 'ᠭ', 'Д': 'ᠳ', 'Е': 'ᠡ', 'Ё': 'ᠶᠣ', 'Ж': 'ᠵ', 'З': 'ᠽ', 'И': 'ᠢ', 'Й': 'ᠶ', 'К': 'ᠬ', 'Л': 'ᠯ', 'М': 'ᠮ', 'Н': 'ᠨ', 'О': 'ᠣ', 'Ө': 'ᠥ', 'П': 'ᠫ', 'Р': 'ᠷ', 'С': 'ᠰ', 'Т': 'ᠲ', 'У': 'ᠤ', 'Ү': 'ᠦ', 'Ф': 'ᠹ', 'Х': 'ᠬ', 'Ц': 'ᠴ', 'Ч': 'ᠴ', 'Ш': 'ᠱ', 'Э': 'ᠡ', 'Ю': 'ᠶᠤ', 'Я': 'ᠶᠠ'
    };

    const mongToCyr = {
      'ᠠ':'а', 'ᠡ':'е', 'ᠢ':'и', 'ᠣ':'о', 'ᠤ':'у', 'ᠥ':'ө', 'ᠦ':'ү', 'ᠧ':'э',
      'ᠪ':'б', 'ᠬ':'х', 'ᠭ':'г', 'ᠳ':'д', 'ᠷ':'р', 'ᠯ':'л', 'ᠮ':'м', 'ᠨ':'н',
      'ᠫ':'п', 'ᠰ':'с', 'ᠲ':'т', 'ᠴ':'ц', 'ᠵ':'ж', 'ᠶ':'й', 'ᠹ':'ф', 'ᠱ':'ш',
      'ᠸ':'в', 'ᠽ':'з', ' ': ' ', '-': '-', '—': '—', '.': '.', ',': ',', '!': '!', '?': '?', ':': ':', ';': ';', '(': '(', ')': ')'
    };

    const textInput = document.getElementById('input');
    const output = document.getElementById('output');
    const fromEl = document.getElementById('from');
    const toEl = document.getElementById('to');
    const swapBtn = document.getElementById('swap');
    const clearBtn = document.getElementById('clear');
    const copyBtn = document.getElementById('copy');
    const themeButtons = document.querySelectorAll('[data-theme]');
    const langButtons = document.querySelectorAll('[data-lang]');

    let sourceLang = 'en';
    let targetLang = 'mn';

    function normalizeText(value) {
      return value.replace(/\r/g, '');
    }

    function transliterateCyrillicToMongolian(value) {
      return Array.from(normalizeText(value)).map(ch => cyrToMong[ch] ?? ch).join('');
    }

    function transliterateMongolianToCyrillic(value) {
      return Array.from(normalizeText(value)).map(ch => mongToCyr[ch] ?? ch).join('');
    }

    function applyConversion() {
      const raw = textInput.value;
      if (!raw.trim()) {
        output.textContent = '';
        return;
      }

      if (sourceLang === 'mn' && targetLang === 'en') {
        output.textContent = transliterateMongolianToCyrillic(raw);
      } else if (sourceLang === 'en' && targetLang === 'mn') {
        output.textContent = transliterateCyrillicToMongolian(raw);
      } else {
        output.textContent = raw;
      }
    }

    function setLanguageSelection() {
      const fromLabel = sourceLang === 'en' ? 'Кирилл' : 'Монгол бичиг';
      const toLabel = sourceLang === 'en' ? 'Монгол бичиг' : 'Кирилл';
      fromEl.textContent = fromLabel;
      toEl.textContent = toLabel;

      langButtons.forEach((button) => {
        const isActive = button.dataset.lang === sourceLang;
        button.setAttribute('aria-pressed', String(isActive));
      });
    }

    function updateDirection() {
      targetLang = sourceLang === 'en' ? 'mn' : 'en';
      setLanguageSelection();
      applyConversion();
    }

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem('theme', theme);
      themeButtons.forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.theme === theme));
      });
    }

    textInput.addEventListener('input', applyConversion);

    swapBtn.addEventListener('click', () => {
      sourceLang = sourceLang === 'en' ? 'mn' : 'en';
      updateDirection();
    });

    clearBtn.addEventListener('click', () => {
      textInput.value = '';
      output.textContent = '';
      textInput.focus();
    });

    copyBtn.addEventListener('click', async () => {
      const text = output.textContent;
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
      } catch (_) {
        const temp = document.createElement('textarea');
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        temp.remove();
      }
    });

    themeButtons.forEach((button) => {
      button.addEventListener('click', () => applyTheme(button.dataset.theme));
    });

    langButtons.forEach((button) => {
      button.addEventListener('click', () => {
        sourceLang = button.dataset.lang;
        updateDirection();
      });
    });

    const initialTheme = localStorage.getItem('theme') || 'light';
    applyTheme(initialTheme);
    setLanguageSelection();
    textInput.value = 'Сайн байна уу';
    applyConversion();
  </script>
</body>
</html>
